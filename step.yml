title: |-
  React Native Fingerprint
summary: |
  Fingerprints your React Native native inputs (native project folders, lockfiles, config, patches) and exports BUNDLE_HASH_STRING, so subsequent cache steps can skip rebuilding native modules on JS-only changes.
description: |
  Computes a deterministic SHA-256 **fingerprint** of the inputs that determine your native build and exports it as **`BUNDLE_HASH_STRING`**, so you can key `restore-cache` / `save-cache` off it and skip the expensive native build when only JavaScript changed.

  It hashes the files and folders in `paths` (folders are hashed recursively), while excluding anything matched by `ignore_paths`. The default `paths` cover the common React Native native inputs — JS lockfiles, `app.json` / `app.config.js`, `patch-package` patches, and the `ios/` and `android/` native projects. It deliberately does not hash your JavaScript source, so a JS-only change reuses the cached native build.

  `ignore_paths` is important for **correctness**, not just speed: it excludes build outputs that change every run (`ios/Pods`, `android/build`, …) and machine-specific files that would otherwise make the fingerprint differ between CI and local (`android/local.properties`, Xcode user state, …).

  Use `BUNDLE_HASH_STRING` as the key for `restore-cache` / `save-cache`, then gate the native/bundle build on restore-cache's `BITRISE_CACHE_HIT` output. On a hit, repack the new JS bundle into the cached app and re-sign.

  **Capture every native input.** The fingerprint decides whether a previously compiled native app can be reused. If `paths`/`ignore_paths` omit an input that affects the native build (a native module dir, a config plugin, an extra lockfile), a native change may not move the key and you could repack onto a **stale binary**. Extend `paths` for your project when needed.

  This is a lightweight, do-it-yourself pattern built on free Bitrise cache steps. For a fully managed, compilation-level remote cache across Gradle, Xcode (LLVM CAS) and C++, see Bitrise Build Cache for React Native: https://bitrise.io/platform/build-cache/react-native

website: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint
source_code_url: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint
support_url: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint/issues

project_type_tags:
- react-native

type_tags:
- utility

host_os_tags:
- osx-10.10
- ubuntu-16.04

is_requires_admin_user: false
is_always_run: false
is_skippable: false

toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-react-native-fingerprint

inputs:
- project_dir: "."
  opts:
    title: "Project directory"
    summary: Root that `paths` and `ignore_paths` are resolved against.
    description: |
      The React Native project root. `paths` and `ignore_paths` are interpreted relative to this directory, and the fingerprint uses each file's path relative to it (so the result is independent of where the project is checked out).
    is_required: true
    is_sensitive: false
    is_expand: true
- paths: |-
    package.json
    package-lock.json
    yarn.lock
    pnpm-lock.yaml
    app.json
    app.config.js
    patches/
    ios/
    android/
  opts:
    title: "Paths to fingerprint"
    summary: Newline-separated files and folders whose contents determine the key. Folders (trailing `/`) are hashed recursively; globs supported.
    description: |
      One entry per line, relative to `project_dir`:
      - a **file** — e.g. `package.json`
      - a **folder** — write it with a trailing slash, e.g. `ios/` (hashed recursively)
      - a **glob** — a `*` / `**` doublestar pattern, e.g. `android/**/*.gradle`

      The trailing slash is a readability convention — the step detects each entry's type automatically, so `ios` and `ios/` behave the same. Missing entries are skipped with a warning. Blank lines and lines starting with `#` are ignored.

      The default covers common React Native native inputs. Extend it with anything else that affects your native build (custom native module directories, additional lockfiles, `Gemfile.lock`, etc.).
    is_required: true
    is_sensitive: false
    is_expand: true
- ignore_paths: |-
    ios/Pods
    ios/build
    ios/DerivedData
    ios/.xcode.env.local
    android/build
    android/app/build
    android/.gradle
    android/app/.cxx
    android/local.properties
    **/xcuserdata
    **/*.xcuserstate
    **/*.log
    **/.DS_Store
    node_modules
    .git
  opts:
    title: "Ignore paths"
    summary: Newline-separated paths/globs to exclude from the fingerprint.
    description: |
      Entries (relative to `project_dir`) excluded from hashing, matched as directory prefixes or `**` doublestar globs. This list matters for correctness: it excludes per-build outputs (`ios/Pods`, `android/build`, …) and machine-specific files (`android/local.properties`, Xcode user state) that would otherwise change the fingerprint between machines and prevent cache hits. Blank lines and `#` comments are ignored.
    is_required: false
    is_sensitive: false
    is_expand: true
- key_prefix:
  opts:
    title: "Cache key prefix"
    summary: Optional namespace prepended to the fingerprint (joined with `-`).
    description: |
      When set, it is prepended to the fingerprint to form `BUNDLE_HASH_STRING` (e.g. `ios-<fingerprint>`). Useful for namespacing the cache key per platform or workflow so different builds don't collide.
    is_required: false
    is_sensitive: false
    is_expand: true
- verbose: "false"
  opts:
    category: Debug
    title: "Verbose logging"
    summary: Log the files that contribute to the fingerprint.
    description: |
      Enable to print (at debug level) each file included in the fingerprint. Useful for confirming your `paths` and `ignore_paths` match what you expect.
    value_options:
    - "true"
    - "false"
    is_required: true
    is_sensitive: false

outputs:
- BUNDLE_HASH_STRING:
  opts:
    title: "Bundle hash"
    summary: |
      The computed fingerprint, prefixed with key_prefix if set.
    description: |-
      The computed native-input fingerprint, prefixed with `key_prefix` if set. Always set on success (the step fails rather than exporting an empty key). Use it as the key for `restore-cache` / `save-cache` steps; gate the build on restore-cache's `BITRISE_CACHE_HIT` output.
