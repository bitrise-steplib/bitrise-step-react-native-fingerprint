title: |-
  React Native Fingerprint
summary: |
  Evaluates a cache-key template over your native inputs and exports BUNDLE_HASH_STRING, so subsequent cache steps can skip rebuilding native modules on JS-only changes.
description: |
  Evaluates a **cache-key template** — the same syntax the `restore-cache` / `save-cache` steps accept — and exports the result as **`BUNDLE_HASH_STRING`** so you can compute the key once and reuse it across restore, save, and build-gating.

  The `key` input supports:
  - `{{ checksum "package.json" "ios/Podfile.lock" "android/**/*.gradle" }}` — SHA-256 over one or more files; glob / `**` doublestar patterns are supported.
  - `{{ getenv "SOME_ENV" }}` — interpolate an environment variable.
  - `.OS`, `.Arch`, `.Branch`, `.CommitHash`, `.Workflow` — e.g. `{{ .OS }}-{{ .Arch }}-...`.

  Use `BUNDLE_HASH_STRING` as the key for the subsequent `restore-cache` / `save-cache` steps, then gate the expensive native/bundle build on restore-cache's `BITRISE_CACHE_HIT` output so it only runs on a cache miss. On a hit, repack the new JS bundle into the cached app and re-sign.

  **Capture every native input.** The fingerprint decides whether a previously compiled native app can be reused. If the key omits an input that affects the native build (a native lockfile, a Gradle file, a config plugin, a patch), a native-only change won't move the key — you'd restore and repack onto a **stale binary and ship a broken build**. The default below covers common React Native native inputs; extend it for your project (config plugins, `patches/`, extra native lockfiles).

  This is a lightweight, do-it-yourself pattern built on free Bitrise cache steps. For a fully managed, compilation-level remote cache across Gradle, Xcode (LLVM CAS) and C++, see Bitrise Build Cache for React Native: https://bitrise.io/platform/build-cache/react-native

website: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint
source_code_url: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint
support_url: https://github.com/bitrise-steplib/bitrise-step-react-native-fingerprint/issues

project_type_tags:
- react-native

type_tags:
- utility

host_os_tags:
- osx-10.10
- ubuntu-16.04

is_requires_admin_user: false
is_always_run: false
is_skippable: false

toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-react-native-fingerprint

inputs:
- key: "{{ checksum \"package.json\" \"package-lock.json\" \"yarn.lock\" \"pnpm-lock.yaml\" \"app.json\" \"app.config.js\" \"ios/Podfile.lock\" \"android/**/*.gradle\" \"android/gradle.properties\" }}"
  opts:
    title: "Cache key template"
    summary: The key template to evaluate into BUNDLE_HASH_STRING. Same syntax as restore-cache / save-cache.
    description: |
      A cache-key template evaluated by the same engine as the `restore-cache` / `save-cache` steps.

      Supported functions and variables:
      - `{{ checksum "<path>" ... }}` — SHA-256 of the listed files; supports glob and `**` doublestar patterns (e.g. `android/**/*.gradle`). Non-matching literal paths are skipped with a warning.
      - `{{ getenv "<ENV>" }}` — value of an environment variable.
      - `.OS`, `.Arch`, `.Branch`, `.CommitHash`, `.Workflow` — build metadata, e.g. `{{ .OS }}-{{ .Arch }}-{{ checksum "package.json" }}`.

      The default fingerprints common React Native native inputs (JS lockfiles, `app.json` / `app.config.js`, `ios/Podfile.lock`, Android Gradle files). Deliberately excludes your JavaScript source, so a JS-only change reuses the cached native build. Extend it to cover anything else that affects your native build (config plugins, `patches/`, additional native lockfiles). The step fails if the template evaluates to an empty string.
    is_required: true
    is_sensitive: false
    is_expand: true
- verbose: "false"
  opts:
    title: "Verbose logging"
    summary: Log the files that feed each checksum.
    description: |
      Enable to print (at debug level) the files matched by each `checksum` in the key. Useful for debugging cache-key changes and confirming your globs match what you expect.
    value_options:
    - "true"
    - "false"
    is_required: true
    is_sensitive: false

outputs:
- BUNDLE_HASH_STRING:
  opts:
    title: "Bundle hash"
    summary: |
      The evaluated cache key.
    description: |-
      The evaluated `key` template. Always set on success (the step fails rather than exporting an empty key). Use it as the key for `restore-cache` / `save-cache` steps; gate the build on restore-cache's `BITRISE_CACHE_HIT` output.
