format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

workflows:
  # check: included from steps-check/steps.bitrise.yml
  # (yamlfmt, step.yml audit, README generation, golangci-lint, go test)

  e2e:
    summary: Runs every `test_`-prefixed workflow in e2e/bitrise.yml.
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    summary: Local debugging convenience — evaluates a key template over generated files and prints the output.
    envs:
    - SAMPLE_DIR: _tmp
    steps:
    - script:
        title: Create sample native inputs
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$SAMPLE_DIR"
            mkdir -p "$SAMPLE_DIR/android/app" "$SAMPLE_DIR/ios"
            echo '{"name":"sample","version":"1.0.0"}' > "$SAMPLE_DIR/package.json"
            echo '{"lockfileVersion":3}' > "$SAMPLE_DIR/package-lock.json"
            echo 'PODS: []' > "$SAMPLE_DIR/ios/Podfile.lock"
            echo 'dependencies {}' > "$SAMPLE_DIR/android/app/build.gradle"
    - path::./:
        title: React Native Fingerprint
        inputs:
        - key: "build-fingerprint-{{ checksum \"$SAMPLE_DIR/package.json\" \"$SAMPLE_DIR/package-lock.json\" \"$SAMPLE_DIR/ios/Podfile.lock\" \"$SAMPLE_DIR/android/**/*.gradle\" }}"
        - verbose: "true"
    - script:
        title: Print exported output
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "BUNDLE_HASH_STRING=$BUNDLE_HASH_STRING"

  generate_readme:
    summary: Regenerates README.md from step.yml. Run manually after any step.yml change.
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}
