format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL-ONLY benchmark: our fingerprint vs. Expo's @expo/fingerprint
#
# NOT part of the CI `e2e` suite (it lives in its own config file and needs Node
# + network to `npm ci` a real Expo app and run @expo/fingerprint). Run it by
# hand to compare change-detection between the two fingerprints:
#
#   bitrise run --config ./e2e/expo-compare.bitrise.yml test_compare_expo_vs_ours
#
# It clones a REAL React Native (managed Expo) app at a pinned commit, then
# applies a small history of representative edits. At each edit it computes:
#   - OURS  — this step's default `key` (checksum of native inputs), scoped to
#             the cloned app dir.
#   - EXPO  — @expo/fingerprint's hash (semantically native-aware).
#
# Verdict per change, comparing each to the baseline:
#   agree            — both changed, or both stable.
#   over-invalidate  — ours changed, Expo didn't. SAFE (an unnecessary rebuild).
#   DANGER           — ours stable, Expo changed. UNSAFE (missed a real native
#                      change -> would repack a stale binary). This FAILS the run.
# ─────────────────────────────────────────────────────────────────────────────

app:
  envs:
  - SAMPLE_REPO: https://github.com/bitrise-silver/expo-build-fingerprint-demo.git
  - SAMPLE_SHA: ef551696ce586f1d07b2417a6b3971962f4a2287
  - APP_DIR: _tmp_expo
  # This step's default key, scoped to the cloned app dir (managed Expo app has
  # no ios/android dirs, so those globs are skipped; package.json/lock/app.json
  # drive the result).
  - OUR_KEY: "{{ checksum \"_tmp_expo/package.json\" \"_tmp_expo/package-lock.json\" \"_tmp_expo/yarn.lock\" \"_tmp_expo/pnpm-lock.yaml\" \"_tmp_expo/app.json\" \"_tmp_expo/app.config.js\" \"_tmp_expo/ios/Podfile.lock\" \"_tmp_expo/android/**/*.gradle\" \"_tmp_expo/android/gradle.properties\" }}"

workflows:
  test_compare_expo_vs_ours:
    summary: Compare this step's fingerprint against @expo/fingerprint over a real Expo app.
    steps:
    - script:
        title: Setup — clone real Expo app, install deps, write helpers
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            command -v node >/dev/null || { echo "Node.js is required for this local benchmark"; exit 1; }

            rm -rf "$APP_DIR"
            git clone "$SAMPLE_REPO" "$APP_DIR"
            git -C "$APP_DIR" checkout --quiet "$SAMPLE_SHA"

            ( cd "$APP_DIR"
              npm ci --no-audit --no-fund
              npm install --no-save --no-audit --no-fund @expo/fingerprint )

            # Expo fingerprint hash of the app (via the library API).
            cat > "$APP_DIR/_expo_hash.js" <<'JS'
            require("@expo/fingerprint")
              .createFingerprintAsync(".")
              .then(f => console.log(f.hash))
              .catch(e => { console.error(e.message); process.exit(1); });
            JS

            # Compare helper, sourced by the verify step.
            cat > "$APP_DIR/_report.sh" <<'SH'
            DANGER=0
            row() {
              # name ours_before ours_after expo_before expo_after
              local name="$1" ob="$2" oa="$3" eb="$4" ea="$5" oc ec verdict
              [ "$ob" = "$oa" ] && oc=stable || oc=CHANGED
              [ "$eb" = "$ea" ] && ec=stable || ec=CHANGED
              if [ "$oc" = stable ] && [ "$ec" = CHANGED ]; then verdict="DANGER (ours missed a native change)"; DANGER=1
              elif [ "$oc" = CHANGED ] && [ "$ec" = stable ]; then verdict="over-invalidate (safe)"
              else verdict="agree"; fi
              printf "  %-26s ours=%-8s expo=%-8s -> %s\n" "$name" "$oc" "$ec" "$verdict"
            }
            SH
    - script:
        title: EXPO — baseline hash
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            H=$( cd "$APP_DIR" && node _expo_hash.js )
            envman add --key EXPO_BASE --value "$H"
    - path::./:
        title: OURS — baseline
        inputs:
        - key: $OUR_KEY
    - script:
        title: save OURS_BASE
        inputs:
        - content: envman add --key OURS_BASE --value "$BUNDLE_HASH_STRING"

    # ── Scenario 1: JS-only edit (App.tsx) — expect both stable ──
    - script:
        title: "Scenario JS — edit App.tsx"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .
            printf '\n// js-only edit\n' >> "$APP_DIR/App.tsx"
    - path::./:
        title: OURS — after JS edit
        inputs:
        - key: $OUR_KEY
    - script:
        title: save OURS_JS + EXPO_JS
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            envman add --key OURS_JS --value "$BUNDLE_HASH_STRING"
            envman add --key EXPO_JS --value "$( cd "$APP_DIR" && node _expo_hash.js )"

    # ── Scenario 2: config change (app.json) — expect both change ──
    - script:
        title: "Scenario CONFIG — edit app.json"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .
            node -e 'const p="'"$APP_DIR"'/app.json",d=require("./"+p);d.expo.extra={marker:"x"};require("fs").writeFileSync(p,JSON.stringify(d,null,2))'
    - path::./:
        title: OURS — after config change
        inputs:
        - key: $OUR_KEY
    - script:
        title: save OURS_CFG + EXPO_CFG
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            envman add --key OURS_CFG --value "$BUNDLE_HASH_STRING"
            envman add --key EXPO_CFG --value "$( cd "$APP_DIR" && node _expo_hash.js )"

    # ── Scenario 3: pure-JS dependency added to package.json (no install) ──
    # Expect: ours CHANGED (package.json bytes changed), Expo stable (no native
    # module added) -> a SAFE over-invalidation.
    - script:
        title: "Scenario DEP-JS — add a pure-JS dependency"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .
            node -e 'const p="'"$APP_DIR"'/package.json",d=require("./"+p);d.dependencies.lodash="^4.17.21";require("fs").writeFileSync(p,JSON.stringify(d,null,2))'
    - path::./:
        title: OURS — after pure-JS dep add
        inputs:
        - key: $OUR_KEY
    - script:
        title: save OURS_DEP + EXPO_DEP
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            envman add --key OURS_DEP --value "$BUNDLE_HASH_STRING"
            envman add --key EXPO_DEP --value "$( cd "$APP_DIR" && node _expo_hash.js )"

    - script:
        title: Report — compare change-detection
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            source "$APP_DIR/_report.sh"
            echo
            echo "==== fingerprint comparison (vs baseline) ===="
            echo "baseline: ours=$OURS_BASE  expo=$EXPO_BASE"
            row "JS-only edit"        "$OURS_BASE" "$OURS_JS"  "$EXPO_BASE" "$EXPO_JS"
            row "config change"       "$OURS_BASE" "$OURS_CFG" "$EXPO_BASE" "$EXPO_CFG"
            row "pure-JS dependency"  "$OURS_BASE" "$OURS_DEP" "$EXPO_BASE" "$EXPO_DEP"
            echo
            if [ "$DANGER" -ne 0 ]; then
              echo "FAIL: ours missed a change Expo detected (dangerous false cache hit)"; exit 1
            fi
            echo "PASS: no dangerous misses (over-invalidations are safe)"
