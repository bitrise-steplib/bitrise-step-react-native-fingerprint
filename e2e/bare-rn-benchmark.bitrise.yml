format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL-ONLY benchmark on a REAL BARE React Native app (committed ios/ + android/)
#
# Needs network (git clone) but NO Node — fully deterministic, always-clean,
# pin-cloned. Run by hand:
#   bitrise run --config ./e2e/bare-rn-benchmark.bitrise.yml test_bare_rn_native_globs
#
# Shows where THIS repo's native-aware default beats the blog's fixed file list.
# Over bitrise-io/Bitrise-React-Native-Sample (bare RN 0.72, real Podfile.lock +
# Gradle) it runs two fingerprints across a change history:
#   SILVER — bitrise-silver step, blog-draft inputs: package.json +
#            package-lock.json + app.json (NO native files).
#   OURS   — this repo's default key: also ios/Podfile.lock + android/**/*.gradle.
#
# Expected: JS-only -> both stable; native-only -> SILVER MISSES, OURS catches;
# dependency -> both change. Fails if OURS ever misses a change it should catch.
# ─────────────────────────────────────────────────────────────────────────────

app:
  envs:
  - SAMPLE_REPO: https://github.com/bitrise-io/Bitrise-React-Native-Sample.git
  - SAMPLE_SHA: af78a98204d1f80a90bf147f2dc279d00eeabd1b
  - SILVER_REPO: https://github.com/bitrise-silver/steps-react-native-fingerprint.git
  - APP_DIR: _tmp_bare
  - SILVER_DIR: _tmp_silver_step
  - OUR_KEY: "{{ checksum \"_tmp_bare/package.json\" \"_tmp_bare/package-lock.json\" \"_tmp_bare/yarn.lock\" \"_tmp_bare/pnpm-lock.yaml\" \"_tmp_bare/app.json\" \"_tmp_bare/app.config.js\" \"_tmp_bare/patches/**/*\" \"_tmp_bare/ios/Podfile.lock\" \"_tmp_bare/android/**/*.gradle\" \"_tmp_bare/android/gradle.properties\" }}"

workflows:
  test_bare_rn_native_globs:
    summary: On a real bare RN app, our native globs catch native changes the blog's fixed list misses.
    steps:
    - script:
        title: Setup — pin-clone the bare RN app and the silver step
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$APP_DIR" "$SILVER_DIR"
            git clone --quiet "$SAMPLE_REPO" "$APP_DIR"
            git -C "$APP_DIR" checkout --quiet "$SAMPLE_SHA"
            git clone --quiet "$SILVER_REPO" "$SILVER_DIR"
            echo "app files:"; ls "$APP_DIR/ios/Podfile.lock" "$APP_DIR/android/app/build.gradle" "$APP_DIR/app.json"

    # ── baseline ──
    - path::_tmp_silver_step:
        title: SILVER — baseline
        inputs:
        - file_paths: |-
            _tmp_bare/package.json
            _tmp_bare/package-lock.json
            _tmp_bare/app.json
        - key_prefix: build-fingerprint
    - script:
        inputs:
        - content: envman add --key SILVER_BASE --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: OURS — baseline
        inputs:
        - key: $OUR_KEY
    - script:
        inputs:
        - content: envman add --key OURS_BASE --value "$BUNDLE_HASH_STRING"

    # ── Scenario 1: JS-only change (a file in neither fingerprint) ──
    - script:
        title: "Scenario JS — add an unlisted JS file"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .; rm -f "$APP_DIR/js_only_change.js"
            echo 'export const x = 1;' > "$APP_DIR/js_only_change.js"
    - path::_tmp_silver_step:
        title: SILVER — after JS change
        inputs:
        - file_paths: |-
            _tmp_bare/package.json
            _tmp_bare/package-lock.json
            _tmp_bare/app.json
        - key_prefix: build-fingerprint
    - script:
        inputs:
        - content: envman add --key SILVER_JS --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: OURS — after JS change
        inputs:
        - key: $OUR_KEY
    - script:
        inputs:
        - content: envman add --key OURS_JS --value "$BUNDLE_HASH_STRING"

    # ── Scenario 2: NATIVE-only change (Podfile.lock + a Gradle file) ──
    - script:
        title: "Scenario NATIVE — edit ios/Podfile.lock and android build.gradle"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .; rm -f "$APP_DIR/js_only_change.js"
            printf '\n  - RNScreens (4.0.0)\n' >> "$APP_DIR/ios/Podfile.lock"
            printf '\n// native tweak\n' >> "$APP_DIR/android/app/build.gradle"
    - path::_tmp_silver_step:
        title: SILVER — after native change
        inputs:
        - file_paths: |-
            _tmp_bare/package.json
            _tmp_bare/package-lock.json
            _tmp_bare/app.json
        - key_prefix: build-fingerprint
    - script:
        inputs:
        - content: envman add --key SILVER_NAT --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: OURS — after native change
        inputs:
        - key: $OUR_KEY
    - script:
        inputs:
        - content: envman add --key OURS_NAT --value "$BUNDLE_HASH_STRING"

    # ── Scenario 3: dependency change (package-lock.json) ──
    - script:
        title: "Scenario DEP — change package-lock.json"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            git -C "$APP_DIR" checkout -- .; rm -f "$APP_DIR/js_only_change.js"
            printf '\n' >> "$APP_DIR/package-lock.json"
    - path::_tmp_silver_step:
        title: SILVER — after dependency change
        inputs:
        - file_paths: |-
            _tmp_bare/package.json
            _tmp_bare/package-lock.json
            _tmp_bare/app.json
        - key_prefix: build-fingerprint
    - script:
        inputs:
        - content: envman add --key SILVER_DEP --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: OURS — after dependency change
        inputs:
        - key: $OUR_KEY
    - script:
        inputs:
        - content: envman add --key OURS_DEP --value "$BUNDLE_HASH_STRING"

    - script:
        title: Report — SILVER (blog list) vs OURS (native-aware)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            st(){ [ "$1" = "$2" ] && echo stable || echo CHANGED; }
            FAIL=0
            echo
            echo "==== bare RN benchmark: SILVER (blog list) vs OURS (native-aware) ===="
            printf "  %-20s SILVER=%-8s OURS=%-8s %s\n" "JS-only change"  "$(st "$SILVER_BASE" "$SILVER_JS")"  "$(st "$OURS_BASE" "$OURS_JS")"  "(expect both stable)"
            printf "  %-20s SILVER=%-8s OURS=%-8s %s\n" "NATIVE-only change" "$(st "$SILVER_BASE" "$SILVER_NAT")" "$(st "$OURS_BASE" "$OURS_NAT")" "(expect SILVER MISS, OURS catch)"
            printf "  %-20s SILVER=%-8s OURS=%-8s %s\n" "dependency change" "$(st "$SILVER_BASE" "$SILVER_DEP")" "$(st "$OURS_BASE" "$OURS_DEP")" "(expect both change)"
            echo

            # JS-only: both must be stable.
            { [ "$(st "$SILVER_BASE" "$SILVER_JS")" = stable ] && [ "$(st "$OURS_BASE" "$OURS_JS")" = stable ]; } \
              || { echo "FAIL: a JS-only change moved a fingerprint"; FAIL=1; }
            # NATIVE: OURS must catch it (the whole point). Record SILVER's behavior.
            if [ "$(st "$OURS_BASE" "$OURS_NAT")" != CHANGED ]; then echo "FAIL: OURS missed a native change"; FAIL=1; fi
            if [ "$(st "$SILVER_BASE" "$SILVER_NAT")" = stable ]; then
              echo "NOTE: SILVER (blog fixed list) MISSED the native change -> would repack a stale binary."
              echo "      OURS caught it via ios/Podfile.lock + android/**/*.gradle."
            fi
            # dependency: both must change.
            { [ "$(st "$SILVER_BASE" "$SILVER_DEP")" = CHANGED ] && [ "$(st "$OURS_BASE" "$OURS_DEP")" = CHANGED ]; } \
              || { echo "FAIL: a dependency change was not detected"; FAIL=1; }

            echo
            [ "$FAIL" -eq 0 ] && echo "PASS: OURS catches native changes the blog's fixed list misses" || { echo "FAILED"; exit 1; }
