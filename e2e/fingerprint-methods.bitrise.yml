format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# ─────────────────────────────────────────────────────────────────────────────
# Fingerprint METHOD validation (decision-support, not a code-correctness gate)
#
# Compares two choices of `file_paths` against the SAME step, over a realistic
# React Native project layout, to answer: "does this fingerprint capture the
# inputs that actually determine whether the compiled native app is reusable?"
#
#   CURRENT  (naive, the step's shipped default): package.json + lockfile only
#   PROPOSED (native-aware, per the blog draft + Expo fingerprint): also app.json
#            and native project files (ios/Podfile.lock, android/*.gradle, ...)
#
# The pipeline this feeds is: fingerprint -> restore-cache -> repack JS + resign.
# A false cache HIT (fingerprint unchanged when native inputs changed) means
# repacking onto a STALE native binary -> broken/incorrect build. So the key
# property to validate is: a native-only change MUST change the fingerprint.
#
# Run a single case locally (no secrets needed):
#   bitrise run --config ./e2e/fingerprint-methods.bitrise.yml test_method_native_change_naive_blindspot
# ─────────────────────────────────────────────────────────────────────────────

app:
  envs:
  - NAIVE_PATHS: |-
      _tmp_methods/package.json
      _tmp_methods/package-lock.json
  - PROPOSED_PATHS: |-
      _tmp_methods/package.json
      _tmp_methods/package-lock.json
      _tmp_methods/app.json
      _tmp_methods/ios/Podfile.lock
      _tmp_methods/android/build.gradle
      _tmp_methods/android/app/build.gradle
      _tmp_methods/android/gradle.properties

step_bundles:
  # Creates a realistic RN project under _tmp_methods/ and writes shell helpers.
  setup:
    steps:
    - script:
        title: Setup — create a realistic RN project
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            D=_tmp_methods
            rm -rf "$D"
            mkdir -p "$D/ios" "$D/android/app"

            cat > "$D/package.json" <<'JSON'
            { "name": "rn-demo", "dependencies": { "react-native": "0.76.0", "react-native-screens": "3.34.0" } }
            JSON
            echo '{"lockfileVersion":3}'                          > "$D/package-lock.json"
            echo '{"expo":{"name":"rn-demo"}}'                    > "$D/app.json"
            echo 'export default function App(){ return null; }'  > "$D/App.tsx"
            printf 'PODS:\n  - React (0.76.0)\n'                   > "$D/ios/Podfile.lock"
            echo 'buildscript { ext { minSdkVersion = 24 } }'     > "$D/android/build.gradle"
            echo 'dependencies { implementation "com.facebook.react:react-android" }' > "$D/android/app/build.gradle"
            echo 'org.gradle.jvmargs=-Xmx2g'                      > "$D/android/gradle.properties"

            cat > "$D/_report.sh" <<'SH'
            report() { echo; echo "==== METHOD VALIDATION: $1 ===="; }
            expect_same() {
              if [ "$2" = "$3" ]; then echo "  [$1] unchanged  OK   ($2)";
              else echo "  [$1] CHANGED    FAIL expected unchanged ($2 -> $3)"; exit 1; fi
            }
            expect_diff() {
              if [ "$2" != "$3" ]; then echo "  [$1] changed    OK   ($2 -> $3)";
              else echo "  [$1] UNCHANGED  FAIL expected a change ($2)"; exit 1; fi
            }
            SH

workflows:
  # JS-only change: BOTH methods should stay stable (native output is reusable,
  # so a cache hit + JS repack is correct and safe).
  test_method_js_only_change_both_stable:
    summary: A JS-only edit must not move either fingerprint.
    steps:
    - bundle::setup: {}
    - path::./:
        title: CURRENT — before
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_BEFORE
        inputs:
        - content: envman add --key NAIVE_BEFORE --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — before
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_BEFORE
        inputs:
        - content: envman add --key PROPOSED_BEFORE --value "$BUNDLE_HASH_STRING"
    - script:
        title: Mutate — edit JavaScript only
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo 'export default function App(){ return null; } // edited' > _tmp_methods/App.tsx
    - path::./:
        title: CURRENT — after
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_AFTER
        inputs:
        - content: envman add --key NAIVE_AFTER --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — after
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_AFTER
        inputs:
        - content: envman add --key PROPOSED_AFTER --value "$BUNDLE_HASH_STRING"
    - script:
        title: Verify — both stable
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            source _tmp_methods/_report.sh
            report "JS-only change (App.tsx)"
            expect_same  "CURRENT"  "$NAIVE_BEFORE"    "$NAIVE_AFTER"
            expect_same  "PROPOSED" "$PROPOSED_BEFORE" "$PROPOSED_AFTER"
            echo "PASS: both methods correctly ignore JS-only changes"

  # Native-only change: the CURRENT (naive) key is BLIND to it (documents the
  # false-hit risk), while the PROPOSED key correctly changes.
  test_method_native_change_naive_blindspot:
    summary: A native-only edit must change the fingerprint; the naive default misses it.
    steps:
    - bundle::setup: {}
    - path::./:
        title: CURRENT — before
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_BEFORE
        inputs:
        - content: envman add --key NAIVE_BEFORE --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — before
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_BEFORE
        inputs:
        - content: envman add --key PROPOSED_BEFORE --value "$BUNDLE_HASH_STRING"
    - script:
        title: Mutate — bump a native dependency (Podfile.lock) and a Gradle file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # a pod version bump / native module change — no package.json change
            printf '  - RNScreens (4.0.0)\n' >> _tmp_methods/ios/Podfile.lock
            printf 'android.enableNativeThing=true\n' >> _tmp_methods/android/gradle.properties
    - path::./:
        title: CURRENT — after
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_AFTER
        inputs:
        - content: envman add --key NAIVE_AFTER --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — after
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_AFTER
        inputs:
        - content: envman add --key PROPOSED_AFTER --value "$BUNDLE_HASH_STRING"
    - script:
        title: Verify — naive blind spot, proposed detects
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            source _tmp_methods/_report.sh
            report "Native-only change (Podfile.lock + gradle.properties)"
            # The naive default does NOT include native files, so it cannot see the
            # change. This is the exact false-hit -> stale-binary risk we validate.
            expect_same  "CURRENT (blind spot)" "$NAIVE_BEFORE"    "$NAIVE_AFTER"
            expect_diff  "PROPOSED"             "$PROPOSED_BEFORE" "$PROPOSED_AFTER"
            echo "PASS: proposed method catches the native change the naive default misses"

  # Dependency change: BOTH methods should change (lockfile is in both lists).
  test_method_dependency_change_both_detect:
    summary: A JS-dependency change must change both fingerprints.
    steps:
    - bundle::setup: {}
    - path::./:
        title: CURRENT — before
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_BEFORE
        inputs:
        - content: envman add --key NAIVE_BEFORE --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — before
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_BEFORE
        inputs:
        - content: envman add --key PROPOSED_BEFORE --value "$BUNDLE_HASH_STRING"
    - script:
        title: Mutate — change the lockfile
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo '{"lockfileVersion":3,"packages":{"changed":true}}' > _tmp_methods/package-lock.json
    - path::./:
        title: CURRENT — after
        inputs:
        - file_paths: $NAIVE_PATHS
    - script:
        title: save NAIVE_AFTER
        inputs:
        - content: envman add --key NAIVE_AFTER --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: PROPOSED — after
        inputs:
        - file_paths: $PROPOSED_PATHS
    - script:
        title: save PROPOSED_AFTER
        inputs:
        - content: envman add --key PROPOSED_AFTER --value "$BUNDLE_HASH_STRING"
    - script:
        title: Verify — both detect
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            source _tmp_methods/_report.sh
            report "Dependency change (package-lock.json)"
            expect_diff  "CURRENT"  "$NAIVE_BEFORE"    "$NAIVE_AFTER"
            expect_diff  "PROPOSED" "$PROPOSED_BEFORE" "$PROPOSED_AFTER"
            echo "PASS: both methods detect dependency changes"
