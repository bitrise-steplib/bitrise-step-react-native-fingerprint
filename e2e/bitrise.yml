format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# This step needs no secrets: fingerprinting is pure file hashing, no network calls.

workflows:
  # Evaluating the same key template twice over identical files yields the same result.
  test_deterministic:
    summary: The evaluated key is deterministic across runs of identical inputs.
    envs:
    - TEST_DIR: _tmp_deterministic
    steps:
    - script:
        title: Setup — create dependency files
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$TEST_DIR"; mkdir -p "$TEST_DIR"
            echo '{"name":"demo"}' > "$TEST_DIR/package.json"
            echo '{"lockfileVersion":3}' > "$TEST_DIR/package-lock.json"
    - path::./:
        title: Execute — first run
        inputs:
        - key: "{{ checksum \"$TEST_DIR/package.json\" \"$TEST_DIR/package-lock.json\" }}"
    - script:
        title: Save first hash
        inputs:
        - content: envman add --key HASH_1 --value "$BUNDLE_HASH_STRING"
    - path::./:
        title: Execute — second run
        inputs:
        - key: "{{ checksum \"$TEST_DIR/package.json\" \"$TEST_DIR/package-lock.json\" }}"
    - script:
        title: Verify — hashes match
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "run 1: $HASH_1"
            echo "run 2: $BUNDLE_HASH_STRING"
            [ -n "$BUNDLE_HASH_STRING" ] || { echo "FAIL: empty hash"; exit 1; }
            [ "$HASH_1" = "$BUNDLE_HASH_STRING" ] || { echo "FAIL: not deterministic"; exit 1; }
            echo "PASS: deterministic"

  # Changing a checksummed file changes the evaluated key.
  test_checksum_change_changes_hash:
    summary: Editing a file referenced by checksum changes the key.
    envs:
    - TEST_DIR: _tmp_checksum
    steps:
    - script:
        title: Setup — create dependency file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$TEST_DIR"; mkdir -p "$TEST_DIR"
            echo '{"name":"demo","version":"1"}' > "$TEST_DIR/package.json"
    - path::./:
        title: Execute — before change
        inputs:
        - key: "{{ checksum \"$TEST_DIR/package.json\" }}"
    - script:
        title: Save hash, then edit the file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            envman add --key HASH_1 --value "$BUNDLE_HASH_STRING"
            echo '{"name":"demo","version":"2"}' > "$TEST_DIR/package.json"
    - path::./:
        title: Execute — after change
        inputs:
        - key: "{{ checksum \"$TEST_DIR/package.json\" }}"
    - script:
        title: Verify — hash changed
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "before: $HASH_1"
            echo "after:  $BUNDLE_HASH_STRING"
            [ "$HASH_1" != "$BUNDLE_HASH_STRING" ] || { echo "FAIL: hash did not change"; exit 1; }
            echo "PASS: checksum change detected"

  # Glob / doublestar patterns match nested files and detect newly added ones.
  test_glob_matches_nested_files:
    summary: A `**` glob hashes nested files and reacts to new matches.
    envs:
    - TEST_DIR: _tmp_glob
    steps:
    - script:
        title: Setup — create nested Gradle files
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$TEST_DIR"; mkdir -p "$TEST_DIR/android/app"
            echo 'buildscript {}' > "$TEST_DIR/android/build.gradle"
            echo 'dependencies {}' > "$TEST_DIR/android/app/build.gradle"
    - path::./:
        title: Execute — before adding a file
        inputs:
        - key: "{{ checksum \"$TEST_DIR/android/**/*.gradle\" }}"
    - script:
        title: Save hash, then add a new nested match
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            envman add --key HASH_1 --value "$BUNDLE_HASH_STRING"
            mkdir -p "$TEST_DIR/android/feature"
            echo '// new module' > "$TEST_DIR/android/feature/build.gradle"
    - path::./:
        title: Execute — after adding a file
        inputs:
        - key: "{{ checksum \"$TEST_DIR/android/**/*.gradle\" }}"
    - script:
        title: Verify — glob picked up the new file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "before: $HASH_1"
            echo "after:  $BUNDLE_HASH_STRING"
            [ -n "$HASH_1" ] || { echo "FAIL: glob matched nothing"; exit 1; }
            [ "$HASH_1" != "$BUNDLE_HASH_STRING" ] || { echo "FAIL: new nested file not detected"; exit 1; }
            echo "PASS: glob detects nested + new files"

  # getenv interpolation and literal prefixes are preserved in the key.
  test_getenv_and_literal_prefix:
    summary: The key template can combine a literal prefix, getenv, and checksum.
    envs:
    - TEST_DIR: _tmp_getenv
    - PLATFORM_TAG: ios-release
    steps:
    - script:
        title: Setup — create dependency file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            rm -rf "$TEST_DIR"; mkdir -p "$TEST_DIR"
            echo '{"name":"demo"}' > "$TEST_DIR/package.json"
    - path::./:
        title: Execute — prefix + getenv + checksum
        inputs:
        - key: "bundle-{{ getenv \"PLATFORM_TAG\" }}-{{ checksum \"$TEST_DIR/package.json\" }}"
    - script:
        title: Verify — prefix and env value present
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "output: $BUNDLE_HASH_STRING"
            case "$BUNDLE_HASH_STRING" in
              bundle-ios-release-*) echo "PASS: prefix + getenv applied" ;;
              *) echo "FAIL: expected 'bundle-ios-release-' prefix"; exit 1 ;;
            esac
